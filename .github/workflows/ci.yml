name: FLOW Windows CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-windows-specs:
    name: Validate Windows Specifications & Governance
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Core Windows Governance Documents
        shell: pwsh
        run: |
          $requiredDocs = @(
              "MIGRATION_MATRIX.md",
              "AGENTS.md",
              "PROJECT_PROFILE.md",
              "ARCHITECTURE.md",
              "ROADMAP.md",
              "SECURITY.md",
              "THIRD_PARTY_NOTICES.md",
              "TESTING_STRATEGY.md",
              "DEPENDENCIES.md",
              "ACCEPTANCE_CRITERIA.md",
              "README.md"
          )
          
          $missing = @()
          foreach ($doc in $requiredDocs) {
              if (-not (Test-Path $doc)) {
                  $missing += $doc
              } else {
                  Write-Host " [PASS] $doc verified." -ForegroundColor Green
              }
          }
          
          if ($missing.Count -gt 0) {
              Write-Error "Missing critical Windows governance documents: $($missing -join ', ')"
              exit 1
          }
          
          Write-Host "All Windows governance and architecture specifications validated." -ForegroundColor Cyan
