name: FLOW Windows CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-windows-specs:
    name: Validate Windows Specifications & Governance
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Core Windows Governance Documents
        shell: pwsh
        run: |
          $requiredDocs = @(
              "MIGRATION_MATRIX.md",
              "AGENTS.md",
              "PROJECT_PROFILE.md",
              "ARCHITECTURE.md",
              "ROADMAP.md",
              "SECURITY.md",
              "THIRD_PARTY_NOTICES.md",
              "TESTING_STRATEGY.md",
              "DEPENDENCIES.md",
              "ACCEPTANCE_CRITERIA.md",
              "README.md"
          )
          
          $missing = @()
          foreach ($doc in $requiredDocs) {
              if (-not (Test-Path $doc)) {
                  $missing += $doc
              } else {
                  Write-Host " [PASS] $doc verified." -ForegroundColor Green
              }
          }
          
          if ($missing.Count -gt 0) {
              Write-Error "Missing critical Windows governance documents: $($missing -join ', ')"
              exit 1
          }
          
          Write-Host "All Windows governance and architecture specifications validated." -ForegroundColor Cyan

  build-and-test-dotnet:
    name: Build & Test Native .NET 9 Solution
    runs-on: windows-latest
    needs: validate-windows-specs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Flow.sln

      - name: Build Solution (Release)
        run: dotnet build Flow.sln -c Release --no-restore

      - name: Run Flow.Core Tests (Release)
        run: dotnet test tests/Flow.Core.Tests/Flow.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Run Flow.Windows Tests (Release)
        run: dotnet test tests/Flow.Windows.Tests/Flow.Windows.Tests.csproj -c Release -p:Platform=x64 --no-build --verbosity normal

  build-react-ui:
    name: Build React Prototype UI
    runs-on: windows-latest
    needs: validate-windows-specs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build UI
        run: npm run build

